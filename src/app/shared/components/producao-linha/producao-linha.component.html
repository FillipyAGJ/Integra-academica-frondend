<!-- producao-linha.component.html -->
<div class="grafico">
  <div class="grafico-chart">
    <h3>
      Evolução da Produção Científica ao longo dos anos @if (siglaIF && siglaIF
      !== 'todos') {
      <span class="sigla-badge">{{ siglaIF }}</span>
      } @else {
      <span class="sigla-badge">Rede Federal</span>
      }
    </h3>

    @if (loading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Carregando dados...</p>
    </div>
    } @else if (erro()) {
    <div class="error-state">
      <p>{{ erro() }}</p>
    </div>
    } @else {
    <div echarts [options]="optionsProducao()" class="demo-chart"></div>
    }
  </div>
</div>
